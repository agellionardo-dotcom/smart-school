<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart School — غير متصل</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Tahoma, sans-serif;
      background: linear-gradient(135deg, #0a1628 0%, #0f2138 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
    }
    .container {
      max-width: 400px;
      padding: 40px 24px;
      background: rgba(15, 33, 56, 0.8);
      border: 1px solid rgba(0, 229, 255, 0.2);
      border-radius: 20px;
      backdrop-filter: blur(20px);
    }
    .icon { font-size: 72px; margin-bottom: 20px; }
    h1 {
      font-size: 24px;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #00e5ff, #a855f7);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p {
      font-size: 15px;
      opacity: 0.8;
      line-height: 1.6;
      margin-bottom: 24px;
    }
    button {
      padding: 12px 32px;
      background: linear-gradient(135deg, #00e5ff, #a855f7);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s;
    }
    button:hover {
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">📡</div>
    <h1>لا يوجد اتصال بالإنترنت</h1>
    <p>
      يبدو أنك غير متصل. تأكد من اتصالك بالإنترنت ثم حاول مرة أخرى.
      <br />
      <small style="opacity: 0.6;">ملاحظة: تسجيل الحضور عبر البصمة أو GPS يعمل offline في التطبيق.</small>
    </p>
    <button onclick="window.location.reload()">🔄 حاول مرة أخرى</button>
  </div>
</body>
</html>
